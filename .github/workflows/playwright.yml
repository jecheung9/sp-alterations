name: Playwright Tests
on:
  push:
    branches: [ main, master, frontend-workflow-test ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
    - name: Install dependencies frontend
      run: npm ci
    - name: install dependencies backend
      run: cd backend && npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: start backend
      run: cd backend && npm run dev &
      env:
        PORT: ${{ secrets.PORT }}
        MONGO_USER: ${{ secrets.MONGO_USER }}
        MONGO_PWD: ${{ secrets.MONGO_PWD }}
        MONGO_CLUSTER: ${{ secrets.MONGO_CLUSTER }}
        DB_NAME: ${{ secrets.DB_NAME }} 
        STATIC_DIR: ${{ secrets.STATIC_DIR }} 
        CLIENTS_COLLECTION_NAME: ${{ secrets.CLIENTS_COLLECTION_NAME }} 
        MEETINGS_COLLECTION_NAME: ${{ secrets.MEETINGS_COLLECTION_NAME }} 
        TODO_COLLECTION_NAME: ${{ secrets.TODO_COLLECTION_NAME }} 
        JWT_SECRET: ${{ secrets.JWT_SECRET }} 
        USERS_COLLECTION_NAME: ${{ secrets.USERS_COLLECTION_NAME }}  
    - name: Run Playwright tests
      run: npx playwright test
      env:
        PORT: ${{ secrets.PORT }}
        MONGO_USER: ${{ secrets.MONGO_USER }}
        MONGO_PWD: ${{ secrets.MONGO_PWD }}
        MONGO_CLUSTER: ${{ secrets.MONGO_CLUSTER }}
        DB_NAME: ${{ secrets.DB_NAME }} 
        STATIC_DIR: ${{ secrets.STATIC_DIR }} 
        CLIENTS_COLLECTION_NAME: ${{ secrets.CLIENTS_COLLECTION_NAME }} 
        MEETINGS_COLLECTION_NAME: ${{ secrets.MEETINGS_COLLECTION_NAME }} 
        TODO_COLLECTION_NAME: ${{ secrets.TODO_COLLECTION_NAME }} 
        JWT_SECRET: ${{ secrets.JWT_SECRET }} 
        USERS_COLLECTION_NAME: ${{ secrets.USERS_COLLECTION_NAME }}   
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
