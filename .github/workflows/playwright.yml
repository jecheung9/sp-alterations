name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      CI: true
      PORT: ${{ secrets.PORT }}
      MONGO_USER: ${{ secrets.MONGO_USER }}
      MONGO_PWD: ${{ secrets.MONGO_PWD }}
      MONGO_CLUSTER: ${{ secrets.MONGO_CLUSTER }}
      DB_NAME: ${{ secrets.DB_NAME }} 
      STATIC_DIR: ${{ secrets.STATIC_DIR }} 
      CLIENTS_COLLECTION_NAME: ${{ secrets.CLIENTS_COLLECTION_NAME }} 
      MEETINGS_COLLECTION_NAME: ${{ secrets.MEETINGS_COLLECTION_NAME }} 
      TODO_COLLECTION_NAME: ${{ secrets.TODO_COLLECTION_NAME }} 
      JWT_SECRET: ${{ secrets.JWT_SECRET }} 
      USERS_COLLECTION_NAME: ${{ secrets.USERS_COLLECTION_NAME }} 
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
